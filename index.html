<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>皮友筆記本</title>
  <style>
    :root { --primary: #00b074; --bg: #f5f6f8; }
    body { background-color: var(--bg); padding-bottom: 100px; font-family: sans-serif; }
    .page { display: none; padding: 20px; }
    .page.active { display: block; }
    .card { background: white; padding: 15px; border-radius: 12px; margin-bottom: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
    .fab { position: fixed; bottom: 80px; right: 20px; background: var(--primary); color: white; border: none; width: 50px; height: 50px; border-radius: 25px; font-size: 24px; z-index: 1000; }
    .modal { position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.5); display: none; z-index: 2000; padding: 20px; }
    .modal.active { display: flex; align-items: center; justify-content: center; }
    .modal-content { background: white; padding: 20px; border-radius: 12px; width: 100%; max-width: 400px; }
    .nav { position: fixed; bottom: 0; width: 100%; background: white; display: flex; justify-content: space-around; padding: 15px; z-index: 1000; }
  </style>
</head>
<body>

<div id="p-friends" class="page active">
  <h2>全部皮友</h2>
  <div id="list-friends"></div>
</div>
<div id="p-mushroom" class="page">
  <h2>蘑菇筆記</h2>
  <div id="list-mush"></div>
</div>

<button class="fab" onclick="showModal()">＋</button>

<div class="nav">
  <button onclick="setPage('p-friends')">皮友</button>
  <button onclick="setPage('p-mushroom')">蘑菇</button>
</div>

<div id="modal" class="modal">
  <div class="modal-content">
    <h3>新增揪菇記錄</h3>
    <input type="text" id="m-name" placeholder="皮友名稱" style="width:100%; margin:10px 0;">
    <button onclick="saveMush()" style="width:100%; padding:10px; background:var(--primary); color:white; border:none;">確認</button>
    <button onclick="hideModal()" style="width:100%; margin-top:5px;">取消</button>
  </div>
</div>

<script>
  let data = JSON.parse(localStorage.getItem('data') || '{"friends":[]}');
  
  function setPage(id) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.getElementById(id).classList.add('active');
  }
  function showModal() { document.getElementById('modal').classList.add('active'); }
  function hideModal() { document.getElementById('modal').classList.remove('active'); }
  
  function saveMush() {
    let name = document.getElementById('m-name').value;
    let f = data.friends.find(x => x.name === name);
    if(!f) { f = {name: name, mushrooms: []}; data.friends.push(f); }
    f.mushrooms.push({date: '08/19'});
    localStorage.setItem('data', JSON.stringify(data));
    hideModal(); render();
  }

  function render() {
    let htmlF = '';
    data.friends.forEach(f => htmlF += `<div class="card">${f.name} - ${f.mushrooms.length}次</div>`);
    document.getElementById('list-friends').innerHTML = htmlF;
    document.getElementById('list-mush').innerHTML = htmlF;
  }
  render();
</script>
</body>
</html>
